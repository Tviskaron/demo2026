<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research demos</title>
<style>
  main {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 32px 24px;
    width: min(100% - 40px, 640px);
    margin: clamp(40px, 12vh, 120px) auto;
    text-align: center;
    font: 600 18px system-ui, sans-serif;
    user-select: none;
  }
  img { -webkit-user-drag: none; }
  a { color: #141414; text-decoration: none; -webkit-tap-highlight-color: transparent; }
  a:hover { text-decoration: underline; }
  img { display: block; width: 100%; margin-bottom: 8px; }
  @media (hover: hover) {
    img { filter: grayscale(1); opacity: 0.75; transition: 0.3s; }
    a:hover img, a:focus img { filter: none; opacity: 1; }
  }
</style>
