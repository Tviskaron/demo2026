<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive research demos: multi-agent pathfinding and small language agents in Crafter and WebShop.">
  <meta name="color-scheme" content="light">
  <title>Research demos</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fff;
      color: #141414;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }
    main { width: min(100% - 40px, 640px); margin: clamp(40px, 12vh, 120px) auto; }
    h1 { margin: 0 0 8px; font-size: clamp(32px, 6vw, 42px); line-height: 1.15; letter-spacing: -0.035em; }
    p { margin: 0; }
    ul { list-style: none; margin: 32px 0 24px; padding: 0; border-top: 2px solid #141414; }
    li { border-bottom: 1px solid #141414; }
    .demo {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      padding: 20px 12px;
      color: inherit;
      text-decoration: none;
    }
    .demo strong { display: block; margin-bottom: 3px; font-size: 20px; }
    .demo:hover { background: #faf8f1; }
    .demo:hover strong { text-decoration: underline; text-underline-offset: 4px; }
    .arrow { align-self: center; font-size: 24px; }
    a:focus-visible { outline: 3px solid #141414; outline-offset: 4px; }
    footer { font-size: 14px; }
    footer a { color: inherit; text-underline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Research demos</h1>
      <p>Multi-agent coordination and small language agents.</p>
    </header>
    <ul aria-label="Demos">
      <li>
        <a class="demo" href="https://mapf.airi.net/">
          <span><strong>Multi-agent pathfinding</strong>DMM, LC-MAPF and MAPF-GPT.</span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
      </li>
      <li>
        <a class="demo" href="https://tviskaron.github.io/zero-wasm/vision-memory.html">
          <span><strong>ZeroHero · Crafter</strong>A small model plays from images.</span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
      </li>
      <li>
        <a class="demo" href="https://iameteron.github.io/zerohero-webshop/">
          <span><strong>ZeroHero · WebShop</strong>A small model completes shopping tasks.</span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
      </li>
    </ul>
    <footer><a href="https://github.com/Tviskaron/demo2026">GitHub</a></footer>
  </main>
</body>
</html>
